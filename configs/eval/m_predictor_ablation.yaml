# Fair ablation: P2.1 MatrixPredictor vs P3 diffusion (x9 + soft sqrt-WBCE, T=700).
#
#   python scripts/eval_m_ablation.py --config configs/eval/m_predictor_ablation.yaml
#
experiment_name: m_predictor_ablation
seed: 42

dataset:
  train_path: null
  selection_path: null
  test_path: null

max_train_examples: 0  # all ~27k

matrix_predictor:
  hidden_dim: 128
  epochs: 8
  learning_rate: 1.0e-3
  augmentation: true  # x9: original + 4 geometric + 4 customer-relabeling views
  weighted_bce: true
  pos_weight_power: 0.5

diffusion:
  # Use the checkpoint selected by validation metrics during training. Never select on test F1.
  checkpoint: null
  step_stride: 1

eval:
  selection_per_size: 16
  per_size: 16
  sizes: [20, 50, 100]
  seed: 0

output:
  # Each regeneration gets a timestamped, provenance-complete run directory.
  root: outputs/eval
