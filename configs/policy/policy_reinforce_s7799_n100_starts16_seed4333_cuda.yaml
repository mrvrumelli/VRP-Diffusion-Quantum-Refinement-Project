experiment_name: policy_reinforce_s7799_n100_starts16_seed4333_cuda
seed: 4333
dataset:
  name: s7799_audit_policy_v1_n100
  path: data/processed/s7799_audit_policy_v1_n100
  cache_size: 0
validation:
  path: data/processed/s7799_val100_policy_v1_n100
  cache_size: 0
output:
  root: outputs/policy
model:
  embedding_dim: 128
  global_num_layers: 5
  global_num_heads: 8
  local_num_layers: 5
  local_num_heads: 8
  feed_forward_dim: 512
  dropout: 0.0
  decoder_num_heads: 8
  clip_constant: 10.0
  adjacency_mode: hard
  local_threshold: 0.5
  use_local_encoder: true
  use_local_pointer: true
  use_global_pointer: true
  use_savings_bias: true
  use_context_perception: true
  savings_weight: 1.0
  savings_epsilon: 0.01
prior:
  source: denoiser
  checkpoint: outputs/train/diffusion_denoiser_s7799_stochastic_persize_n100_cuda_20260816T152405895038Z/checkpoints/best.pt
  num_inference_steps: 50
  threshold: 0.5
  use_probabilities: true
training:
  epochs: 6
  # Task 6 variant 3, third seed (autonomous_long_compute_guide_2026-09-24.md /
  # task6_n100_hyperparameter_sweep_2026-09-24.md): seeds 42 (K=1 30.18%) and 4332 (K=1 28.74%)
  # both beat the 30.57% diffusion-only target with num_starts=16 -- a third seed matches this
  # project's own established 3-seed confirmation standard (stochastic_reference_probe.md) before
  # calling this the new N100 recipe, rather than freezing on 2 seeds alone.
  learning_rate: 0.0001
  weight_decay: 0.000001
  batch_size: 16
  num_starts: 16
  val_num_starts: 16
  start_node_cap: 100
  baseline: multi_start
  entropy_weight: 0.0
  gradient_clip_norm: 1.0
  early_stop_patience: 0
  check_feasibility: true
  device: cuda
  deterministic: false
  max_runtime_seconds: 10800
checkpoint:
  best_metric: val_best_cost
  minimize: true
mlflow:
  enabled: false
