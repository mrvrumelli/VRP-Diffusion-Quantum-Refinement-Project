# Experiment config template.
#
# Copy this file to a new name under configs/train/ (or the matching configs/<stage>/
# subdirectory) for a new experiment. Do not edit this file in place. Every field below is
# required by src/vrp_diffusion_quantum/utils/experiment.py::ExperimentTracker; keep the field
# names as-is so tracking stays consistent across experiments (see docs/coding_standards.md).

experiment_name: template_experiment
seed: 0

dataset:
  name: template_dataset
  path: data/samples/template_dataset

output:
  root: outputs/train

model:
  # model-specific hyperparameters go here
  hidden_dim: 128
  num_layers: 4

training:
  epochs: 10
  learning_rate: 0.0003
  batch_size: 64
