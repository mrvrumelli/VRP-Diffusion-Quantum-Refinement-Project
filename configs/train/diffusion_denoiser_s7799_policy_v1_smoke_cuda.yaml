experiment_name: diffusion_denoiser_s7799_policy_v1_smoke_cuda
seed: 4322
dataset:
  name: s7799_policy_v1_smoke
  path: data/processed/s7799_policy_v1_smoke/train
validation:
  path: data/processed/s7799_policy_v1_smoke/val
output:
  root: outputs/train
model:
  hidden_dim: 192
  num_layers: 8
  time_embed_dim: 192
  node_encoder_type: gat
  gat_num_layers: 5
  gat_num_heads: 8
  gat_dropout: 0.0
  gat_checkpoint: null
  freeze_node_encoder: true
schedule:
  num_timesteps: 700
  beta_start: 0.0001
  beta_end: 0.02
training:
  epochs: 1
  learning_rate: 0.0003
  batch_size: 4
  device: cuda
  deterministic: false
  mixed_precision: true
  gradient_accumulation_steps: 4
  gradient_clip_norm: 1.0
  max_runtime_seconds: 900
  augmentation: false
  weighted_bce: true
  pos_weight_power: 0.5
  same_size_batches: true
  adaptive_threshold: true
  early_stop_patience: 0
  t_sample: high
checkpoint:
  best_metric: val_auc
  minimize: false
sample_eval:
  every: 1
  per_size: 1
  sizes: [20, 50, 100]
  step_stride: 20
mlflow:
  enabled: false
