experiment_name: diffusion_denoiser_paper_cmd
seed: 42
alignment:
  track: paper_cmd
  contract_version: 1
  paper_id: arxiv:2603.07568v1
  claim: paper-guided reconstruction; exact author seeds and skipped sampler remain unconfirmed
dataset:
  name: paper_cmd_hgs_50k_train
  provenance_track: paper_cmd
  label_policy: single_hgs_route_partition
  path: null
  lazy: true
  cache_size: 0
validation:
  path: null
  cache_size: 0
output:
  root: outputs/paper_cmd
model:
  hidden_dim: 128
  num_layers: 5
  time_embed_dim: 128
  node_encoder_type: gat
  gat_num_layers: 5
  gat_num_heads: 8
  gat_dropout: 0.0
  gat_checkpoint: null
  freeze_node_encoder: true
  normalization: batch_norm
schedule:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.000001
  batch_size: 32
  device: auto
  augmentation: false
  online_augmentation: true
  augmentation_recipe: paper_cmd_labeled
  weighted_bce: true
  pos_weight_power: 1.0
  same_size_batches: true
  adaptive_threshold: true
  early_stop_patience: 10
  t_sample: uniform
checkpoint:
  best_metric: sample_f1
  minimize: false
sample_eval:
  every: 2
  per_size: 8
  sizes: [20, 50, 100]
  num_inference_steps: 50
  sampler: skipped_posterior
mlflow:
  enabled: true
