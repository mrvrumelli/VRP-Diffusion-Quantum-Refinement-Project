experiment_name: gat_pretrain_paper_cmd_full
seed: 42
alignment:
  track: paper_cmd
  contract_version: 1
  paper_id: arxiv:2603.07568v1
  claim: paper-guided reconstruction; exact author seeds and GAT objective remain unconfirmed
dataset:
  name: paper_cmd_hgs_full_train
  provenance_track: paper_cmd
  label_policy: single_hgs_route_partition
  path: data/processed/paper_cmd_full_50k_splits/train
validation:
  path: data/processed/paper_cmd_full_50k_splits/val
output:
  root: outputs/paper_cmd
model:
  hidden_dim: 128
  gat_num_layers: 5
  gat_num_heads: 8
  dropout: 0.0
training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.000001
  optimizer: adam
  batch_size: 64
  device: auto
  augmentation: false
  online_augmentation: true
  augmentation_recipe: paper_cmd_labeled
  weighted_bce: true
  pos_weight_power: 1.0
  same_size_batches: true
  adaptive_threshold: true
  early_stop_patience: 10
mlflow:
  enabled: false
