experiment_name: gat_pretrain_s7799_1k_cuda
seed: 42
dataset:
  name: cvrp_uniform_train_s7799_1k_per_size
  path: data/processed/s7799_1k_per_size/train
validation:
  path: data/processed/s7799_1k_per_size/val
output:
  root: outputs/train
model:
  hidden_dim: 192
  gat_num_layers: 5
  gat_num_heads: 8
  dropout: 0.0
training:
  # Bounded 3060 Ti pretraining stage; the runtime cap is checked after each epoch.
  epochs: 100
  learning_rate: 0.001
  batch_size: 8
  device: cuda
  deterministic: false
  mixed_precision: true
  gradient_accumulation_steps: 2
  gradient_clip_norm: 1.0
  max_runtime_seconds: 1800
  augmentation: false
  weighted_bce: true
  pos_weight_power: 0.5
  same_size_batches: true
  adaptive_threshold: true
  early_stop_patience: 0
mlflow:
  enabled: true
