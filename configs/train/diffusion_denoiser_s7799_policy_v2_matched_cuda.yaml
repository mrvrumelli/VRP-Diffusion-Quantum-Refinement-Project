experiment_name: diffusion_denoiser_s7799_policy_v2_matched_cuda
seed: 4331
dataset:
  name: s7799_audited_policy_v2
  path: data/processed/s7799_audit_policy_v2
validation:
  path: data/processed/s7799_val100_policy_v1
output:
  root: outputs/train
model:
  hidden_dim: 192
  num_layers: 8
  time_embed_dim: 192
  node_encoder_type: gat
  gat_num_layers: 5
  gat_num_heads: 8
  gat_dropout: 0.0
  gat_checkpoint: outputs/train/gat_policy_compare_selected_e5_s4330_20260815T022447868980Z/checkpoints/gat_encoder_best.pt
  freeze_node_encoder: true
schedule:
  num_timesteps: 700
  beta_start: 0.0001
  beta_end: 0.02
training:
  epochs: 5
  learning_rate: 0.0003
  batch_size: 4
  device: cuda
  deterministic: false
  mixed_precision: true
  gradient_accumulation_steps: 4
  gradient_clip_norm: 1.0
  max_runtime_seconds: 3600
  augmentation: false
  weighted_bce: true
  pos_weight_power: 0.5
  same_size_batches: true
  adaptive_threshold: true
  early_stop_patience: 0
  t_sample: uniform
checkpoint:
  best_metric: route_mean_cost_gap_percent
  minimize: true
sample_eval:
  every: 1
  per_size: 5
  sizes: [20, 50, 100]
  seed: 24331
  step_stride: 1
  transition_mode: stochastic
  prior_positive_probability: 0.5
mlflow:
  enabled: false
