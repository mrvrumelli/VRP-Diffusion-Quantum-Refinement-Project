# Sanity training config for scripts/train_matrix_predictor.py (task P2.1).
#
# Trains on one tiny hand-crafted example and validates on the other. This proves the held-out
# code path but is not a meaningful quality result; point dataset.path at a Phase 1 examples/
# directory for a real experiment.

experiment_name: matrix_predictor_sanity
seed: 0

dataset:
  name: sanity_cvrp
  path: data/samples/sanity_cvrp

output:
  root: outputs/train

model:
  hidden_dim: 64

training:
  epochs: 300
  learning_rate: 0.05

split:
  validation_fraction: 0.5
  test_fraction: 0.0

evaluation:
  threshold: 0.5
  num_calibration_bins: 10
  random_baseline_seed: 0
  max_plots: 20
