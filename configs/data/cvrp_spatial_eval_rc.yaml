config_name: cvrp_spatial_eval_rc
seed: 9903

# Independent-seed, plain-CVRP spatial stress set for the NEXT eval pool (fresh seed block,
# distinct from the original cvrp_spatial_rc.yaml seed 8803, whose 3,000 RC instances were folded
# into training via rc_full_audit_policy_v1). "RC" means a random/clustered customer mix; this is
# inspired by the spatial taxonomy only and is not a Solomon VRPTW benchmark.
sizes: [20, 50, 100]
num_instances: 1000
capacity: null
depot_mode: random
customer_mode: random_clustered
demand_mode: uniform
route_size: null
cluster_decay: 0.04
output_dir: data/raw/cvrp/spatial_stress_eval_rc_s9903
