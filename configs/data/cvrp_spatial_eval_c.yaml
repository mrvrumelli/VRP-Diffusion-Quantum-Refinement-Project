config_name: cvrp_spatial_eval_c
seed: 9902

# Independent-seed, plain-CVRP spatial stress set for the NEXT eval pool (fresh seed block,
# distinct from the original cvrp_spatial_c.yaml seed 8802, whose 3,000 C instances were folded
# into training via rc_full_audit_policy_v1). "C" means clustered customer locations; this is
# inspired by the spatial taxonomy only and is not a Solomon VRPTW benchmark.
sizes: [20, 50, 100]
num_instances: 1000
capacity: null
depot_mode: random
customer_mode: clustered
demand_mode: uniform
route_size: null
cluster_decay: 0.04
output_dir: data/raw/cvrp/spatial_stress_eval_c_s9902
