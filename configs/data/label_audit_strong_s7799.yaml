config_name: label_audit_strong_s7799
input_dir: data/processed/label_audit_s7799
output_dir: outputs/label_audit/s7799_strong_reference

expected_counts_by_size:
  20: 500
  50: 500
  100: 500

pyvrp:
  # Each base seed is deterministically combined with the instance id.
  base_seeds: [9101, 9102, 9103, 9104]
  time_budgets_by_size:
    20: 10.0
    50: 20.0
    100: 40.0

ortools:
  # Challenge every unstable case plus this deterministic stable control sample per size.
  stable_sample_per_size: 50

acceptance:
  near_best_relative_tolerance: 0.001
  seed_spread_relative_tolerance: 0.005
  matrix_disagreement_tolerance: 0.05
  challenger_improvement_relative_tolerance: 0.000001
  minimum_near_best_seeds: 2

# null selects min(CPU count - 1, 16). Override from the CLI for a smaller desktop.
workers: null
