[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vrp-diffusion-quantum"
version = "0.1.0"
description = "Reproducible CMD-based CVRP solver with optional quantum local refinement experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "VRP Diffusion Quantum Refinement contributors" },
]
dependencies = [
    "matplotlib>=3.8",
    "mlflow>=2.14",
    "networkx>=3.3",
    "numpy>=2.0.2,<2.8",
    "ortools>=9.10",
    "pandas>=2.2",
    "pyvrp>=0.10",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
    "tensorboard>=2.16",
    "torch>=2.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0.12.20240311",
]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]
quantum = [
    "dimod>=0.12",
    "dwave-neal>=0.6",
    "qiskit>=1.2",
    "qiskit-aer>=0.14",
    "qiskit-algorithms>=0.3",
    "qiskit-optimization>=0.6",
]
tracking = [
    "wandb>=0.17",
]
ui = [
    "streamlit>=1.32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "cuda: tests that require a CUDA-capable GPU and CUDA-enabled PyTorch",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
packages = ["vrp_diffusion_quantum"]
strict = true
warn_unreachable = true
warn_unused_configs = true

# networkx and scikit-learn ship no inline types and no maintained third-party stub package, so
# mypy cannot see their signatures. ignore_missing_imports here only suppresses that "no stubs
# found" note; it does not weaken checking of our own code, which stays under strict = true.
[[tool.mypy.overrides]]
module = ["networkx.*", "sklearn.*", "streamlit.*"]
ignore_missing_imports = true
